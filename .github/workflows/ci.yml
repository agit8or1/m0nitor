name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        env:
          V: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run ruff==0.8.4 check app
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: build test image
        run: docker build --build-arg DEV=1 -t netmon-app:test app
      - name: pytest (synthetic fixtures only)
        run: docker run --rm --network none netmon-app:test python -m pytest -q -p no:cacheprovider tests
      - name: NAT attribution scenarios against a throwaway ClickHouse (synthetic rows only)
        env:
          CH: clickhouse/clickhouse-server:26.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
        run: |
          docker network create --internal natsc
          docker run -d --name nat-ch --network natsc -e CLICKHOUSE_SKIP_USER_SETUP=1 "$CH"
          for i in $(seq 60); do docker exec nat-ch clickhouse-client -q "SELECT 1" >/dev/null 2>&1 && break; sleep 1; done
          docker run --rm --network natsc -e NETMON_TEST_CH_URL=http://nat-ch:8123/ netmon-app:test \
            python -m pytest -q -p no:cacheprovider -rs tests/test_nat_scenarios.py
