name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste real addresses, hostnames, credentials, logs or captures** — replace them
        with documentation ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) or example.com.
        Security issues: use private reporting (see SECURITY.md), not an issue.
  - type: input
    id: version
    attributes:
      label: m0nitor version
      description: Shown in the top bar of every page and at /netmon/healthz (for example v1.12).
    validations:
      required: true
  - type: dropdown
    id: firewall
    attributes:
      label: Firewall
      options: [OPNsense, pfSense, Demo (no firewall), Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …\n3. See …"
  - type: textarea
    id: coverage
    attributes:
      label: Coverage / logs (sanitized)
      description: Relevant lines from Settings → Health or the Coverage page, or `docker compose logs` output with addresses replaced.
      render: text
