metadata:
  providers:
    # OPNsense has no SNMP by default; interface names come from static config.
    # ifindexes are filled in after reading the firewall's interface table.
    - type: static
      exporters:
        # BEGIN netmon-exporters  (rendered from Settings → Firewalls by host/netmon-apply-sites; example below)
        10.40.0.1/32:
          name: fw-a
          default:
            name: unknown
            description: unmapped ifindex
            speed: 0
          ifindexes:
            5: {name: ix0, description: "WAN", speed: 10000}
            12: {name: bridge0, description: "LAN bridge", speed: 10000}
        # END netmon-exporters
routing:
  provider:
    type: bmp
    # Before increasing this value, look for it in the scaling section
    # of the documentation.
    receive-buffer: 212992
core:
  # OPNsense NetFlow is unsampled and does not advertise a sampling rate.
  default-sampling-rate: 1
  exporter-classifiers:
    # BEGIN netmon-classifiers
    - ClassifySite("site-a")
    - ClassifyRole("firewall")
    # END netmon-classifiers
  interface-classifiers:
    # The interface described "WAN" is the only external boundary; LAN and VPN interfaces are internal.
    - Interface.Description == "WAN" && ClassifyExternal() && ClassifyConnectivity("transit")
    - ClassifyInternal()
