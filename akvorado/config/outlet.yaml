---
geoip:
  optional: true
  # When running on Docker, these paths are inside the container. By default,
  # IPinfo databases are used. (https://ipinfo.io/)
  asn-database:
    - /usr/share/GeoIP/asn.mmdb
  geo-database:
    - /usr/share/GeoIP/country.mmdb
  # If you want to use MaxmindDB, check `.env`, `docker-compose-maxmind.yml` and
  # update these paths:
  #asn-database:
  # - /usr/share/GeoIP/GeoLite2-ASN.mmdb
  #geo-database:
  # - /usr/share/GeoIP/GeoLite2-Country.mmdb

networks:
  networks:
    # Internal ranges (extend once OPNsense interfaces are confirmed).
    10.0.0.0/8:
      name: rfc1918-10
      role: internal
    172.16.0.0/12:
      name: rfc1918-172
      role: internal
    192.168.0.0/16:
      name: rfc1918-192
      role: internal
    # Your own networks (examples; documentation ranges). netmon's Settings → Sites lists the real ones.
    10.40.0.0/24:
      name: lan
      role: servers
    203.0.113.176/28:
      name: public-a
      role: dc-public
  network-sources: []

