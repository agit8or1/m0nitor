services:
  caddy:
    # Caddy v2.11.7 rebuilt with patched Go and dependencies (see image/Dockerfile) until upstream rebuilds.
    image: netmon/caddy:2.11.7-patched
    build: ./image
    network_mode: host   # needs host loopback to reach Traefik on 127.0.0.1:8081
    restart: unless-stopped
    environment:
      NETMON_SITE: ${NETMON_SITE:?set NETMON_SITE in .env}
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
