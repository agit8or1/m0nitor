services:
  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host   # needs host loopback to reach Traefik on 127.0.0.1:8081
    restart: unless-stopped
    environment:
      NETMON_SITE: ${NETMON_SITE:?set NETMON_SITE in .env}
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
