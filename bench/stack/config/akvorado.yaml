---
# Benchmark copy of the monitoring stack's Akvorado configuration: same Kafka topic layout, same ClickHouse
# resolutions and TTLs (retention), same TCPFlags column. Synthetic data only.
kafka:
  topic: flows
  brokers: [kafka:9092]
  topic-configuration:
    num-partitions: 8
    replication-factor: 1
    config-entries:
      segment.bytes: 1073741824
      retention.ms: 86400000
      cleanup.policy: delete
      compression.type: producer
clickhousedb:
  servers: [clickhouse:9000]
clickhouse:
  orchestrator-url: http://akvorado-orchestrator:8080
  prometheus-endpoint: /metrics
  resolutions:
    - {interval: 0, ttl: 720h}
    - {interval: 1m, ttl: 168h}
    - {interval: 5m, ttl: 2160h}
    - {interval: 1h, ttl: 8760h}
inlet: !include "inlet.yaml"
outlet: !include "outlet.yaml"
console: {}
schema:
  enabled: [TCPFlags]
