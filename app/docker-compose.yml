services:
  netmon-app:
    build: .
    image: netmon-app:1.29   # = netmon/__init__.py __version__ (tests/test_version.py)
    restart: unless-stopped
    read_only: true
    group_add: ["10001"]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NETMON_CONFIG: /app/config.yaml
      NETMON_DB: /data/netmon.db
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ../data:/data
      - ../secrets:/run/secrets:ro
      - ../keys:/run/keys:ro      # master key for secrets at rest (netmon.secretbox), kept out of data/
      - /var/log/netmon:/var/log/netmon:ro   # rsyslog-written OPNsense logs (group netmon, gid 10001)
      - akvorado-geoip:/usr/share/GeoIP:ro      # the IPinfo country database Akvorado enriches flows with (same source for block events)
      - zeek-logs:/var/log/zeek:ro              # optional Zeek sensor's JSON logs (empty until the zeek profile runs)
    ports:
      - 127.0.0.1:8090:8000   # only Caddy (host loopback) can reach it
    networks: [akvorado]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/netmon/healthz')"]
      interval: 60s
      timeout: 10s
      start_period: 120s
  # Optional Zeek sensor (docs/zeek-sensor.md). Off unless started with: docker compose --profile zeek up -d
  # NETMON_ZEEK_IFACE (in .env) must be a capture-only interface with no IP address, fed by a mirror/SPAN.
  zeek:
    profiles: ["zeek"]
    image: zeek/zeek@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5   # 9.0.0
    restart: unless-stopped
    network_mode: host          # must see the host's capture interface
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]   # packet capture + promiscuous mode only
    security_opt: [no-new-privileges:true]
    environment:
      ZEEK_IFACE: ${NETMON_ZEEK_IFACE:-}
      ZEEK_SENSOR: ${NETMON_ZEEK_SENSOR:-mirror}
    volumes:
      - zeek-logs:/logs
      - ./zeek:/etc/netmon:ro
    entrypoint: ["/bin/bash", "/etc/netmon/run.sh"]
volumes:
  zeek-logs:
  akvorado-geoip:
    external: true
    name: akvorado_akvorado-geoip
networks:
  akvorado:
    external: true
    name: akvorado_default
