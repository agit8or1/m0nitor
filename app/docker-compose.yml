services:
  netmon-app:
    build: .
    image: netmon-app:0.1.0
    restart: unless-stopped
    read_only: true
    group_add: ["10001"]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NETMON_CONFIG: /app/config.yaml
      NETMON_DB: /data/netmon.db
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ../data:/data
      - ../secrets:/run/secrets:ro
      - /var/log/netmon:/var/log/netmon:ro   # rsyslog-written OPNsense logs (group netmon, gid 10001)
      - akvorado-geoip:/usr/share/GeoIP:ro      # the IPinfo country database Akvorado enriches flows with (same source for block events)
    ports:
      - 127.0.0.1:8090:8000   # only Caddy (host loopback) can reach it
    networks: [akvorado]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/netmon/healthz')"]
      interval: 60s
      timeout: 10s
      start_period: 120s
volumes:
  akvorado-geoip:
    external: true
    name: akvorado_akvorado-geoip
networks:
  akvorado:
    external: true
    name: akvorado_default
